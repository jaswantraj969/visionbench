[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionbench"
description = "Reproducible computer-vision benchmarking and explainability platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dynamic = ["version"]
# torch/torchvision are listed with compatible ranges; install the build
# (CPU or CUDA) from the official PyTorch wheel index first — see README.
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "numpy>=1.26,<3",
    "pillow>=10.1,<13",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "psutil>=5.9,<8",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
visionbench = "visionbench.cli:main"

[tool.setuptools.dynamic]
version = { attr = "visionbench.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["max_jobs(n): the test's worker exits by itself after n jobs (coverage data is saved)"]

[tool.coverage.run]
source = ["visionbench"]
branch = true
# Measure the `visionbench worker` subprocesses and their spawn children too: coverage starts
# itself in every Python subprocess (patch=subprocess) and in multiprocessing children, and saves
# data before os._exit (the child watchdog). Data files are combined after the run. Processes
# that are hard-killed (by design in some tests) write no data.
parallel = true
patch = ["subprocess", "_exit"]
concurrency = ["thread", "multiprocessing"]
